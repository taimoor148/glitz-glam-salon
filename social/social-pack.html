<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social Pack — Luxe &amp; Bloom Beauty Salon</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#170c10; --wine:#6e1f2c; --wine-deep:#48121b;
    --cream:#f7f1e7; --champagne:#c6a15e; --champagne-l:#e3cd9d; --gold:#b8904c;
    --text:#2b2023; --muted:#7c6a60;
    --serif:"Cormorant Garamond",Georgia,serif; --sans:"Jost","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#e8e0d3;padding:40px 24px;font-family:var(--sans);font-weight:300}
  .page-title{font-family:var(--serif);font-size:22px;color:var(--wine-deep);margin-bottom:28px;letter-spacing:.04em}
  .canvas{position:relative;overflow:hidden;background:var(--ink);margin:0 auto 48px}
  .canvas img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .logo{position:absolute;z-index:2}
  .logo img{position:relative;width:100%;height:auto;filter:drop-shadow(0 2px 14px rgba(0,0,0,.45))}
  .serif{font-family:var(--serif);color:var(--cream)}
  .serif em{font-style:italic;color:var(--champagne-l)}
  .sans{color:rgba(247,241,231,.82)}
  .cta{font-family:var(--sans);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--cream);background:var(--wine);border:1px solid rgba(198,161,94,.55);text-align:center;z-index:2}
  /* ---- IG POST 1080x1080 ---- */
  #ig-post{width:1080px;height:1080px;background:
    radial-gradient(130% 90% at 85% -8%, rgba(198,161,94,.32), rgba(198,161,94,0) 58%),
    radial-gradient(120% 90% at -10% 108%, rgba(110,31,44,.45), rgba(110,31,44,0) 55%),
    linear-gradient(160deg,#24151a 0%,#170c10 70%)}
  #ig-post .logo{top:56px;left:56px;width:120px}
  #ig-post .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 90px;z-index:2}
  #ig-post .eyebrow{font-size:15px;letter-spacing:.5em;text-transform:uppercase;color:var(--champagne-l);margin-bottom:26px;font-weight:500}
  #ig-post .headline{font-size:96px;line-height:1.04;font-weight:500;letter-spacing:.01em}
  #ig-post .rule{width:120px;height:2px;background:linear-gradient(90deg,transparent,var(--champagne),transparent);margin:34px 0 26px}
  #ig-post .sub{font-size:22px;letter-spacing:.34em;text-transform:uppercase;color:rgba(247,241,231,.75)}
  #ig-post .cta{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);width:420px;padding:26px 0;font-size:21px;letter-spacing:.18em;border-radius:6px;box-shadow:0 24px 60px -24px rgba(0,0,0,.7)}
  #ig-post .meta{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-size:15px;letter-spacing:.22em;color:rgba(247,241,231,.55);text-transform:uppercase}
  /* ---- IG STORY 1080x1920 ---- */
  #ig-story{width:1080px;height:1920px}
  #ig-story .shade{position:absolute;inset:0;z-index:1;background:
    linear-gradient(180deg,rgba(23,12,16,.28) 0%,rgba(23,12,16,0) 30%),
    linear-gradient(0deg,rgba(23,12,16,.82) 0%,rgba(23,12,16,.12) 46%)}
  #ig-story .logo{top:64px;left:50%;transform:translateX(-50%);width:150px}
  #ig-story .mid{position:absolute;left:0;right:0;bottom:250px;text-align:center;padding:0 80px;z-index:2}
  #ig-story .eyebrow{font-size:18px;letter-spacing:.5em;text-transform:uppercase;color:var(--champagne-l);margin-bottom:22px;font-weight:500}
  #ig-story .headline{font-size:110px;line-height:1.02;font-weight:500}
  #ig-story .sub{font-size:24px;letter-spacing:.3em;text-transform:uppercase;color:rgba(247,241,231,.8);margin-top:26px}
  #ig-story .cta{margin:0 auto;width:520px;padding:28px 0;font-size:22px;letter-spacing:.18em;border-radius:8px;box-shadow:0 26px 70px -24px rgba(0,0,0,.75)}
  #ig-story .cta-wrap{position:absolute;left:0;right:0;bottom:64px;text-align:center;z-index:2}
  /* ---- FB COVER 820x312 ---- */
  #fb-cover{width:820px;height:312px;background:
    radial-gradient(100% 220% at 12% 0%, rgba(198,161,94,.30), rgba(198,161,94,0) 55%),
    linear-gradient(110deg,#24151a 0%,#170c10 78%)}
  #fb-cover .logo{left:34px;top:50%;transform:translateY(-50%);width:86px}
  #fb-cover .brand{position:absolute;left:150px;top:50%;transform:translateY(-50%);font-family:var(--serif);font-size:52px;font-weight:600;color:var(--cream);line-height:1}
  #fb-cover .brand em{font-style:italic;color:var(--champagne)}
  #fb-cover .tag{position:absolute;left:152px;top:calc(50% + 44px);font-size:12px;letter-spacing:.4em;text-transform:uppercase;color:rgba(247,241,231,.72)}
  #fb-cover .right{position:absolute;right:34px;top:50%;transform:translateY(-50%);text-align:right;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--champagne-l);line-height:2}
</style>
</head>
<body>
  <p class="page-title" data-page>Luxe &amp; Bloom — Social Media Pack</p>

  <div class="canvas" id="ig-post">
    <div class="logo"><img src="../assets/logo-mark.svg" alt=""></div>
    <div class="mid">
      <p class="eyebrow">Beauty Salon</p>
      <p class="headline serif">Beauty,<br><em>Refined.</em></p>
      <div class="rule"></div>
      <p class="sub" data-loc1>Beauty &middot; Bridal &middot; Spa</p>
    </div>
    <p class="cta">Book on WhatsApp</p>
    <p class="meta" data-meta>4.4&#9733; &middot; 2,200+ Google Reviews</p>
  </div>

  <div class="canvas" id="ig-story">
    <img src="../assets/img/gallery-2.jpg" alt="">
    <div class="shade"></div>
    <div class="logo"><img src="../assets/logo-mark.svg" alt=""></div>
    <div class="mid">
      <p class="eyebrow">Bridal &amp; Party Makeup</p>
      <p class="headline serif">Your Look,<br><em>Perfected.</em></p>
      <p class="sub" data-brand-sub>Luxe &amp; Bloom</p>
    </div>
    <div class="cta-wrap"><p class="cta">Reserve Your Date</p></div>
  </div>

  <div class="canvas" id="fb-cover">
    <div class="logo"><img src="../assets/logo-mark.svg" alt=""></div>
    <p class="brand" data-brand>Luxe <em>&amp;</em> Bloom</p>
    <p class="tag" data-tag>Beauty Salon</p>
    <div class="right" data-loc2>Open 7 Days a Week</div>
  </div>
<script src="../js/config.js"></script>
<script>
(function(){
  var CFG = window.GLAZ || {};
  if (CFG.brand) {
    var B = CFG.brand;
    var wm = B.wordmark || (B.line1 + (B.amp ? ' <em>&amp;</em> ' : ' ') + B.line2);
    var wmPlain = wm.replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();
    var br = document.querySelector('[data-brand]');
    if (br) br.innerHTML = wm;
    var pg = document.querySelector('[data-page]');
    if (pg) pg.textContent = wmPlain + ' — Social Media Pack';
    var bs = document.querySelector('[data-brand-sub]');
    if (bs) bs.textContent = wmPlain + (CFG.location && CFG.location.area ? ' · ' + CFG.location.area : '');
  }
  if (CFG.location) {
    var L = CFG.location;
    var locStr = [L.area, L.city].filter(Boolean).join(' · ');
    var l1 = document.querySelector('[data-loc1]');
    if (l1) l1.innerHTML = locStr ? (L.area + ' &middot; ' + L.city) : 'Beauty &middot; Bridal &middot; Spa';
    var l2 = document.querySelector('[data-loc2]');
    if (l2) l2.innerHTML = locStr ? (L.area + ', ' + L.city + '<br>Open 7 Days a Week') : 'Open 7 Days a Week';
  }
  if (CFG.rating && CFG.reviewCount) {
    var meta = document.querySelector('[data-meta]');
    if (meta) meta.textContent = CFG.rating + '\u2605' + ' \u00b7 ' + Number(CFG.reviewCount).toLocaleString() + '+ Google Reviews';
  }
})();
</script>
</body>
</html>
