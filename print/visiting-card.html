<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visiting Card — Glitz &amp; Glam Beauty Salon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#170c10; --wine:#6e1f2c; --wine-deep:#48121b;
    --cream:#f7f1e7; --champagne:#c6a15e; --champagne-l:#e3cd9d; --gold:#b8904c;
    --text:#2b2023; --muted:#7c6a60;
    --serif:"Cormorant Garamond",Georgia,serif; --sans:"Jost","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);font-weight:300;background:#e8e0d3;display:flex;flex-direction:column;align-items:center;padding:40px 20px;gap:28px}
  .stage-title{font-family:var(--serif);font-size:20px;color:var(--wine-deep);letter-spacing:.04em}
  .stage{display:flex;gap:32px;flex-wrap:wrap;justify-content:center}
  .card{
    width:85mm;height:55mm;position:relative;overflow:hidden;border-radius:2.5mm;
    box-shadow:0 20px 50px -20px rgba(40,15,22,.55);
    background:var(--ink);
  }
  .card--front{background:
    radial-gradient(120% 160% at 82% -10%, rgba(198,161,94,.28), rgba(198,161,94,0) 55%),
    linear-gradient(150deg,#24151a 0%, #170c10 62%);
  }
  .card--back{background:var(--cream);color:var(--text)}
  .card::before{
    content:"";position:absolute;inset:0;
    border:1px solid rgba(198,161,94,.5);
    border-radius:2.5mm;margin:1.6mm;
    pointer-events:none;
  }
  .card .inner{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:7mm 8mm;z-index:1}
  .card .logo{width:14mm;height:auto;margin-bottom:3mm;filter:drop-shadow(0 0 6px rgba(227,205,157,.35))}
  .brand{font-family:var(--serif);font-size:17pt;font-weight:600;letter-spacing:.05em;color:var(--cream);line-height:1}
  .brand em{font-style:italic;color:var(--champagne)}
  .tag{font-size:5.4pt;letter-spacing:.42em;text-transform:uppercase;color:rgba(247,241,231,.72);margin-top:2.4mm}
  .rule{width:10mm;height:.35mm;background:var(--champagne);margin:2.8mm auto 0}
  /* back */
  .card--back .brand{color:var(--wine-deep);font-size:15pt}
  .card--back .rule{margin:2mm auto 3.2mm}
  .contact{font-size:8.2pt;line-height:2.1;color:var(--text)}
  .contact .lbl{font-size:5.2pt;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);display:block}
  .contact a{color:inherit;text-decoration:none}
  .contact .loc{font-family:var(--serif);font-style:italic;color:var(--wine);font-size:8.6pt}
  .strip{position:absolute;left:0;top:0;bottom:0;width:1.4mm;background:linear-gradient(180deg,var(--champagne),var(--gold))}
  @media print{
    @page{size:A4;margin:0}
    body{background:#fff;padding:0;gap:0;display:block}
    .stage-title,.hint{display:none}
    .stage{display:block}
    .card{border-radius:0;box-shadow:none;margin:0}
    .card--front{page-break-after:always}
    .card::before{margin:2mm}
  }
  .hint{font-size:11px;color:#8a7a6a;letter-spacing:.04em;text-align:center;max-width:560px;line-height:1.7}
</style>
</head>
<body>
  <p class="stage-title">Glitz &amp; Glam — Visiting Card</p>
  <p class="hint">Print on A4 with double-sided printing — front on page 1, back on page 2. Cards are 85 &times; 55&nbsp;mm. Cut along the card edge.</p>
  <div class="stage">
    <div class="card card--front" aria-label="Card front">
      <div class="inner">
        <img class="logo" src="../assets/logo-mark.svg" alt="">
        <p class="brand">Glitz <em>&amp;</em> Glam</p>
        <p class="tag">Beauty Salon &middot; WAPDA Town</p>
        <div class="rule"></div>
      </div>
    </div>
    <div class="card card--back" aria-label="Card back">
      <div class="strip"></div>
      <div class="inner">
        <p class="brand">Glitz <em>&amp;</em> Glam</p>
        <div class="rule"></div>
        <div class="contact">
          <span class="lbl">Call / WhatsApp</span>
          <a data-phone></a>
        </div>
        <div class="contact">
          <span class="lbl">Instagram</span>
          <span data-instagram></span>
        </div>
        <div class="contact loc">
          WAPDA Town, Phase 1, Lahore
        </div>
      </div>
    </div>
  </div>
<script src="../js/config.js"></script>
<script>
(function(){
  var CFG = window.GLAZ || {};
  var ph = document.querySelector('[data-phone]');
  if (ph) ph.textContent = CFG.phoneDisplay || '';
  var ig = document.querySelector('[data-instagram]');
  if (ig) ig.textContent = (CFG.instagram || '').replace(/^https?:\/\//,'') || '@glitzandglam';
})();
</script>
</body>
</html>
